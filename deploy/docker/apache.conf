ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/app/frontend
    DirectoryIndex index.html
    <Directory /var/www/app/frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    AliasMatch "^/api/.*$" "/var/www/app/backend/router.php"
    <Directory /var/www/app/backend>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%m %U %H\" %>s %b"
</VirtualHost>
