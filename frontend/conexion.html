<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conexión · Villa Horizonte</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><main class="content" style="max-width:640px;margin:auto"><div class="page-heading"><div><h1>Conectar tu base de datos</h1><p>Usa los datos de conexión del servidor que registraste en pgAdmin.</p></div></div><section class="card card-body"><form id="connection-form" method="post" action="/api/config"><p>Servidor: <strong>127.0.0.1</strong> (este equipo)</p><div class="fields two"><div class="field"><label for="port">Puerto</label><input id="port" name="port" type="number" min="1" max="65535" value="5434" required></div><div class="field"><label for="user">Usuario</label><input id="user" name="user" value="postgres" maxlength="63" required autocomplete="username"></div><div class="field full"><label for="database">Base de datos</label><input id="database" name="database" value="proyecto_villa_horizonte" maxlength="63" required></div><div class="field full"><label for="password">Contraseña de PostgreSQL</label><input id="password" name="password" type="password" autocomplete="current-password"></div></div><p class="help">Se comprobarán las tablas y procedimientos existentes. Tus datos y estructura se conservarán.</p><p id="connection-result" role="status" aria-live="polite"></p><div class="filter-actions"><a class="btn" href="/">Volver</a><button class="btn primary" type="submit">Comprobar y guardar conexión</button></div></form></section></main><script defer src="/js/connection.js"></script></body>
</html>
